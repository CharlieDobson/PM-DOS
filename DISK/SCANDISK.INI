; SCANDISK.INI
;
; Settings for ScanDisk.  ScanDisk reads this file from the current
; directory, the directories of PATH, or the root of the boot drive.
; Without the file, the settings are the ones shown here.


; [ENVIRONMENT] is how ScanDisk behaves on every run.
;
; Display      Auto or Graphics.  Graphics is a graphics screen on an
;              EGA or a VGA, the same as /G.
; Mouse        On or Off.
; ScanTimeOut  On or Off.  On makes the surface scan treat a read that
;              takes more than two seconds as a failed one.
; NumPasses    How many times the surface scan reads each cluster:
;              1 to 65535.  More than a few is slow.
; LabelCheck   On or Off.  On checks the volume label for characters
;              a label cannot have.
; LfnCheck     On or Off.  On checks long file name entries, and
;              offers to remove the ones that belong to no file.
;              Off leaves every long name entry alone.

[ENVIRONMENT]
   Display     = Auto
   Mouse       = On
   ScanTimeOut = Off
   NumPasses   = 1
   LabelCheck  = Off
   LfnCheck    = On


; [CUSTOM] is what ScanDisk does when it is started with /CUSTOM.
;
; DriveSummary  Auto, On or Off: the summary after each drive.  Auto
;               shows the summary only when a problem was found.
; AllSummary    Auto, On or Off: the summary after the last drive.
; Surface       Never, Always or Prompt: the surface scan.
;               /SURFACE on the command line is Always.
; SaveLog       Off, Append or Overwrite: SCANDISK.LOG in the root of
;               the boot drive.
; Undo          Prompt or Never: whether to ask for an Undo disk.

[CUSTOM]
   DriveSummary  = Auto
   AllSummary    = Auto
   Surface       = Never
   SaveLog       = Off
   Undo          = Prompt

; What to do about each kind of problem.
;
;    Prompt   ask
;    Fix      repair without asking
;    Quit     stop ScanDisk
;    Skip     leave the problem and go on (where shown)
;    Delete   delete without asking (where shown)
;    Save     save lost clusters as files (LostClust)

   FAT_Media     = Prompt    ; a wrong media descriptor: Prompt, Fix, Quit
   Okay_Entries  = Prompt    ; files and directories that can be
                             ; repaired: Prompt, Fix, Quit
   Bad_Chain     = Prompt    ; files and directories that have to be
                             ; cut short: Prompt, Fix, Quit
   Crosslinks    = Prompt    ; cross-linked files: Prompt, Fix, Quit
   Mismatch_FAT  = Prompt    ; FAT copies that differ: Prompt, Fix,
                             ; Quit, Skip
   Bad_Clusters  = Prompt    ; clusters that cannot be read: Prompt,
                             ; Fix, Quit, Skip
   Bad_Entries   = Prompt    ; directory entries that cannot be
                             ; repaired: Prompt, Delete, Quit
   LostClust     = Prompt    ; lost clusters: Prompt, Save, Delete,
                             ; Quit, Skip

; MS-DOS has more settings here, for DoubleSpace and DriveSpace
; volumes: CheckHost, DS_Header, Boot_Sector, Invalid_MDFAT,
; DS_Crosslinks, DS_LostClust, DS_Signatures.  ScanDisk reads them and
; does nothing with them.
